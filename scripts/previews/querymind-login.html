<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueryMind — sign in (UI preview from repo LoginPage)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 400: "#3bcb87", 500: "#17b06a" } },
          fontFamily: { display: ['"Syne"', "system-ui", "sans-serif"], sans: ['"DM Sans"', "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-slate-950 flex font-sans">
  <div class="hidden lg:flex flex-col justify-between w-1/2 bg-slate-900 p-12 border-r border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-brand-500 rounded-lg flex items-center justify-center text-white text-sm font-bold">Q</div>
      <span class="font-display text-xl text-white tracking-tight font-bold">QueryMind</span>
    </div>
    <div>
      <p class="text-brand-400 text-sm font-medium uppercase tracking-widest mb-6">Natural Language SQL</p>
      <h1 class="font-display text-5xl font-bold text-white leading-tight mb-6">Ask questions.<br />Get answers.</h1>
      <p class="text-slate-400 text-lg leading-relaxed max-w-sm">Connect your databases and query them in plain English. No SQL expertise required.</p>
    </div>
    <div class="grid grid-cols-3 gap-4">
      <div class="bg-slate-800 rounded-lg p-3 text-center border border-slate-700 text-slate-300 text-sm">PostgreSQL</div>
      <div class="bg-slate-800 rounded-lg p-3 text-center border border-slate-700 text-slate-300 text-sm">MySQL</div>
      <div class="bg-slate-800 rounded-lg p-3 text-center border border-slate-700 text-slate-300 text-sm">SQLite</div>
    </div>
  </div>
  <div class="flex-1 flex items-center justify-center p-8">
    <div class="w-full max-w-md">
      <h2 class="font-display text-3xl font-bold text-white mb-2">Sign in</h2>
      <p class="text-slate-400 mb-8">Welcome back — let's get querying.</p>
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
          <input type="email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100" value="you@company.com" readonly />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
          <input type="password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100" value="••••••••" readonly />
        </div>
        <button type="button" class="w-full py-3 rounded-lg bg-brand-500 text-white font-semibold">Sign in</button>
      </div>
    </div>
  </div>
</body>
</html>
