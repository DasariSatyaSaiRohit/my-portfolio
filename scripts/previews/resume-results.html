<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResumeJobMatcher — results preview (from repo layout)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: Inter, system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">
  <div class="sticky top-0 z-20 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-screen-xl mx-auto px-4 py-3 flex items-center justify-between">
      <p class="font-bold text-gray-900 text-lg">18 jobs found</p>
      <button type="button" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg">New Search</button>
    </div>
  </div>
  <div class="max-w-screen-xl mx-auto px-4 py-6">
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-5">
      <div class="bg-white rounded-xl border p-3 text-center"><p class="text-xl font-bold text-blue-600">18</p><p class="text-xs text-gray-500">Total</p></div>
      <div class="bg-white rounded-xl border p-3 text-center"><p class="text-xl font-bold text-green-600">84%</p><p class="text-xs text-gray-500">Avg Match</p></div>
      <div class="bg-white rounded-xl border p-3 text-center"><p class="text-xl font-bold text-teal-600">6</p><p class="text-xs text-gray-500">Remote</p></div>
      <div class="bg-white rounded-xl border p-3 text-center"><p class="text-xl font-bold text-purple-600">4</p><p class="text-xs text-gray-500">Hyderabad</p></div>
      <div class="bg-white rounded-xl border p-3 text-center"><p class="text-xl font-bold text-orange-500">9</p><p class="text-xs text-gray-500">With Salary</p></div>
    </div>
    <div class="space-y-3">
      <article class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
        <div class="flex justify-between gap-2"><h3 class="font-semibold text-gray-900">Backend Engineer · FastAPI</h3><span class="text-sm font-bold text-green-600">92%</span></div>
        <p class="text-sm text-gray-500 mt-1">Acme Corp · Remote · Python, Redis, PostgreSQL</p>
        <button type="button" class="mt-3 text-sm text-blue-600 font-semibold">Apply now →</button>
      </article>
      <article class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
        <div class="flex justify-between gap-2"><h3 class="font-semibold text-gray-900">Full Stack Developer</h3><span class="text-sm font-bold text-green-600">88%</span></div>
        <p class="text-sm text-gray-500 mt-1">Infyshine · Visakhapatnam · Angular, NestJS</p>
        <button type="button" class="mt-3 text-sm text-blue-600 font-semibold">Apply now →</button>
      </article>
    </div>
  </div>
</body>
</html>
